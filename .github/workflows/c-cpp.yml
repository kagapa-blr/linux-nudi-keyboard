name: Linux Debian Package Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debian package
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.version.outputs.next_tag }}
      debian_version: ${{ steps.version.outputs.debian_version }}
      semantic_version: ${{ steps.version.outputs.semantic_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libibus-1.0-dev \
            pkg-config \
            ibus

      - name: Determine package and release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$latest_tag" ]; then
            next_tag='v1.0.0'
          else
            version_no=${latest_tag#v}
            if ! [[ "$version_no" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag format: $latest_tag"
              exit 1
            fi
            IFS='.' read -r major minor patch <<< "$version_no"
            patch=$((patch + 1))
            next_tag="v${major}.${minor}.${patch}"
          fi

          if git rev-parse --verify "$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists. Refusing to overwrite an existing release."
            exit 1
          fi

          semantic_version="${next_tag#v}"
          debian_version="${semantic_version}"
          author_name="${GITHUB_ACTOR:-GitHub Actions}"
          author_email="${GITHUB_ACTOR:-github-actions[bot]}@users.noreply.github.com"

          {
            printf '%s\n' "kannada-nudi (${debian_version}) unstable; urgency=medium"
            printf '\n'
            printf '  * Release %s.\n' "$next_tag"
            printf '\n'
            printf ' -- %s <%s>  %s\n' "$author_name" "$author_email" "$(date -R)"
            printf '\n'
            cat debian/changelog
          } > debian/changelog.new && mv debian/changelog.new debian/changelog

          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "debian_version=$debian_version" >> "$GITHUB_OUTPUT"
          echo "semantic_version=$semantic_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $next_tag"
          echo "Debian package version: $debian_version"
          echo "Release asset version: $semantic_version"

      - name: Apply release version to project metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.semantic_version }}
        run: |
          sed -i -E "s/(project\\(kannada-nudi VERSION )[0-9]+\\.[0-9]+\\.[0-9]+/\\1${RELEASE_VERSION}/" CMakeLists.txt
          sed -i -E "s#(<version>)[0-9]+\\.[0-9]+\\.[0-9]+(</version>)#\\1${RELEASE_VERSION}\\2#" com.example.Nudi.xml

          grep -q "project(kannada-nudi VERSION ${RELEASE_VERSION}" CMakeLists.txt
          grep -q "<version>${RELEASE_VERSION}</version>" com.example.Nudi.xml
          dpkg-parsechangelog -S Version | grep -qx "$RELEASE_VERSION"

      - name: Build Debian package
        shell: bash
        run: |
          dpkg-buildpackage -us -uc -b
          package_path=$(ls ../kannada-nudi_${{ steps.version.outputs.debian_version }}_amd64.deb)
          artifact_path="build-artifacts/kannada-nudi_${{ steps.version.outputs.semantic_version }}_amd64.deb"
          mkdir -p build-artifacts
          cp "$package_path" "$artifact_path"
          ls -l build-artifacts

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v5
        with:
          name: kannada-nudi-deb
          path: build-artifacts/*.deb

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            cmake \
            gcc-c++ \
            glib2-devel \
            gtk3-devel \
            ibus-devel \
            pkgconf-pkg-config \
            rpm-build

      - name: Prepare versioned source archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.semantic_version }}
        run: |
          sed -i -E "s/(project\\(kannada-nudi VERSION )[0-9]+\\.[0-9]+\\.[0-9]+/\\1${RELEASE_VERSION}/" CMakeLists.txt
          sed -i -E "s#(<version>)[0-9]+\\.[0-9]+\\.[0-9]+(</version>)#\\1${RELEASE_VERSION}\\2#" com.example.Nudi.xml

          mkdir -p "$HOME/rpmbuild/SOURCES"
          tar -czf "$HOME/rpmbuild/SOURCES/kannada-nudi-${RELEASE_VERSION}.tar.gz" \
            --transform="s,^linux-nudi-keyboard,kannada-nudi-${RELEASE_VERSION}," \
            --exclude-vcs \
            -C .. \
            linux-nudi-keyboard

      - name: Build RPM package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.semantic_version }}
        run: |
          rpmbuild -bb \
            --define "nudi_version ${RELEASE_VERSION}" \
            "$GITHUB_WORKSPACE/packaging/kannada-nudi.spec"

          mkdir -p build-artifacts
          rpm_path=$(find "$HOME/rpmbuild/RPMS" \
            -type f \
            -name "kannada-nudi-${RELEASE_VERSION}-*.rpm" \
            -print -quit)
          test -n "$rpm_path"
          cp "$rpm_path" \
            "build-artifacts/kannada-nudi-${RELEASE_VERSION}_x86_64.rpm"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v5
        with:
          name: kannada-nudi-rpm
          path: build-artifacts/*.rpm

  build-windows:
    name: Build Windows executable
    runs-on: windows-2022
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and test Windows executable
        shell: pwsh
        run: .\build-windows.ps1 -Configuration Release -Clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: kannada-nudi-windows
          path: build-artifacts/*.zip

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-rpm, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Debian artifact
        uses: actions/download-artifact@v5
        with:
          name: kannada-nudi-deb
          path: dist

      - name: Download RPM artifact
        uses: actions/download-artifact@v5
        with:
          name: kannada-nudi-rpm
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: kannada-nudi-windows
          path: dist

      - name: Create git tag if needed
        shell: bash
        run: |
          git fetch --tags --force
          tag="${{ needs.build.outputs.next_tag }}"
          if git rev-parse --verify "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists locally. Refusing to overwrite an existing version."
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Release tag is $tag"

      - name: Publish packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh --version
          tag="${{ needs.build.outputs.next_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists. Refusing to overwrite an existing release."
            exit 1
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes "Kannada Nudi Keyboard packages for Debian/Ubuntu, Fedora-compatible Linux distributions, and Windows." \
            dist/*
