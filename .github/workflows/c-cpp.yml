name: Linux Debian Package Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debian package
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.version.outputs.next_tag }}
      debian_version: ${{ steps.version.outputs.debian_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libibus-1.0-dev \
            pkg-config \
            ibus

      - name: Determine package and release version
        id: version
        shell: bash
        run: |
          debian_version=$(dpkg-parsechangelog -S Version)
          release_version=${debian_version%-*}
          next_tag="v${release_version}"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "debian_version=$debian_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $next_tag"
          echo "Debian package version: $debian_version"

      - name: Build Debian package
        shell: bash
        run: |
          dpkg-buildpackage -us -uc -b
          package_path=$(ls ../kannada-nudi-linux-keyboard_${{ steps.version.outputs.debian_version }}_amd64.deb)
          mkdir -p build-artifacts
          cp "$package_path" build-artifacts/
          ls -l build-artifacts

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v5
        with:
          name: kannada-nudi-linux-keyboard-deb
          path: build-artifacts/*.deb

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Debian artifact
        uses: actions/download-artifact@v5
        with:
          name: kannada-nudi-linux-keyboard-deb
          path: dist

      - name: Create git tag if needed
        shell: bash
        run: |
          git fetch --tags --force
          tag="${{ needs.build.outputs.next_tag }}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "Release tag is $tag"

      - name: Publish Debian package to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh --version
          tag="${{ needs.build.outputs.next_tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "Kannada Nudi Linux Keyboard Debian package release for Ubuntu." \
              dist/*.deb
          else
            gh release upload "$tag" dist/*.deb --clobber
          fi
