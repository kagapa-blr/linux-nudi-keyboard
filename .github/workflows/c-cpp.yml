name: Linux Debian Package Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debian package
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.version.outputs.next_tag }}
      debian_version: ${{ steps.version.outputs.debian_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libibus-1.0-dev \
            pkg-config \
            ibus

      - name: Determine package and release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$latest_tag" ]; then
            next_tag='v1.0.0'
          else
            version_no=${latest_tag#v}
            if ! [[ "$version_no" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag format: $latest_tag"
              exit 1
            fi
            IFS='.' read -r major minor patch <<< "$version_no"
            patch=$((patch + 1))
            next_tag="v${major}.${minor}.${patch}"
          fi

          if git rev-parse --verify "$next_tag" >/dev/null 2>&1; then
            echo "Tag $next_tag already exists. Refusing to overwrite an existing release."
            exit 1
          fi

          debian_version="${next_tag#v}-1"
          author_name="${GITHUB_ACTOR:-GitHub Actions}"
          author_email="${GITHUB_ACTOR:-github-actions[bot]}@users.noreply.github.com"

          {
            printf '%s\n' "kannada-nudi-linux-keyboard (${debian_version}) unstable; urgency=medium"
            printf '\n'
            printf '  * Release %s.\n' "$next_tag"
            printf '\n'
            printf ' -- %s <%s> %s\n' "$author_name" "$author_email" "$(date -R)"
            printf '\n'
            cat debian/changelog
          } > debian/changelog.new && mv debian/changelog.new debian/changelog

          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "debian_version=$debian_version" >> "$GITHUB_OUTPUT"
          echo "Release tag: $next_tag"
          echo "Debian package version: $debian_version"

      - name: Build Debian package
        shell: bash
        run: |
          dpkg-buildpackage -us -uc -b
          package_path=$(ls ../kannada-nudi-linux-keyboard_${{ steps.version.outputs.debian_version }}_amd64.deb)
          mkdir -p build-artifacts
          cp "$package_path" build-artifacts/
          ls -l build-artifacts

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v5
        with:
          name: kannada-nudi-linux-keyboard-deb
          path: build-artifacts/*.deb

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Debian artifact
        uses: actions/download-artifact@v5
        with:
          name: kannada-nudi-linux-keyboard-deb
          path: dist

      - name: Create git tag if needed
        shell: bash
        run: |
          git fetch --tags --force
          tag="${{ needs.build.outputs.next_tag }}"
          if git rev-parse --verify "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists locally. Refusing to overwrite an existing version."
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Release tag is $tag"

      - name: Publish Debian package to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh --version
          tag="${{ needs.build.outputs.next_tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists. Refusing to overwrite an existing release."
            exit 1
          fi
          gh release create "$tag" \
            --title "$tag" \
            --notes "Kannada Nudi Linux Keyboard Debian package release for Ubuntu." \
            dist/*.deb
